name: NativeAOT contracts

on:
  pull_request:
    paths:
      - 'Doroti/src/**'
      - 'Doroti/validation/**'
      - 'Doroti/Directory.*'
      - 'Doroti/global.json'
      - '.github/workflows/native-aot-contracts.yml'
  push:
    paths:
      - 'Doroti/src/**'
      - 'Doroti/validation/**'
      - 'Doroti/Directory.*'
      - 'Doroti/global.json'
      - '.github/workflows/native-aot-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Doroti/global.json
      - name: Reject DLR in converted layers in Debug and Release
        run: python3 Doroti/validation/native-aot/check-clean-layers.py --output Doroti/artifacts/native-aot/ci-clean-layers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-layer-evidence
          path: Doroti/artifacts/native-aot/ci-clean-layers

  native-contracts:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: images
            executable: Doroti.Validation.NativeAot.Images
          - contract: restoration
            executable: Doroti.Validation.NativeAot.Restoration
          - contract: focus
            executable: Doroti.Validation.NativeAot.Focus
          - contract: localizations
            executable: Doroti.Validation.NativeAot.Localizations
          - contract: layout
            executable: Doroti.Validation.NativeAot.Layout
          - contract: forms
            executable: Doroti.Validation.NativeAot.Forms
          - contract: calendar
            executable: Doroti.Validation.NativeAot.Calendar
          - contract: routing
            executable: Doroti.Validation.NativeAot.Routing
          - contract: inspector
            executable: Doroti.Validation.NativeAot.Inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Doroti/global.json
      - name: Publish and execute native contract
        working-directory: Doroti
        shell: bash
        env:
          CONTRACT: ${{ matrix.contract }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) contract_rid=osx-arm64 ;;
            x86_64) contract_rid=osx-x64 ;;
            *) exit 2 ;;
          esac
          evidence="artifacts/native-aot/ci-native/$CONTRACT"
          python3 validation/native-aot/run.py --log "$evidence/publish.log" -- dotnet publish "validation/native-aot/$CONTRACT" -c Release -r "$contract_rid" -p:UseSharedCompilation=false -o "$evidence/publish"
          python3 validation/native-aot/run.py --log "$evidence/execute.log" -- "$evidence/publish/$EXECUTABLE" --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-contract-${{ matrix.contract }}-evidence
          path: |
            Doroti/artifacts/native-aot/ci-native/**/*.log
            Doroti/artifacts/native-aot/ci-native/**/*.result.json
