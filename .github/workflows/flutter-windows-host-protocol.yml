name: Flutter Windows Host Protocol

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate pinned Flutter Windows host protocol
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out DorotiLab
        uses: actions/checkout@v4

      - name: Read pinned Flutter revision
        id: contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $protocol = Get-Content -LiteralPath 'Doroti/validation/contracts/flutter-windows-host-protocol.json' -Raw | ConvertFrom-Json
          "flutter_ref=$($protocol.reference.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out pinned Flutter source
        uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: ${{ steps.contract.outputs.flutter_ref }}
          path: reference/flutter-master
          fetch-depth: 1

      - name: Validate source pin, anchors, and mappings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./Doroti/eng/validate-flutter-windows-host-protocol.ps1
