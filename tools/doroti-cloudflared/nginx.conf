server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .NET WASM threads and Doroti's managed worker require cross-origin isolation.
    # Cloudflare terminates HTTPS; these headers also apply to workers and errors.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    # Use .NET's precompressed .gz files when the client accepts gzip.
    gzip_static on;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing runtime/static assets must not return the SPA's HTML document.
    location /_framework/ {
        try_files $uri =404;
    }

    location /_content/ {
        try_files $uri =404;
    }

    # Nginx's stock mime.types does not map .mjs. Module workers reject
    # application/octet-stream even when HTTPS and COOP/COEP are correct.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location ~ \.[^/]+$ {
        try_files $uri =404;
    }
}
